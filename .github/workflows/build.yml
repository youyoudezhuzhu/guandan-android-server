name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Android SDK / NDK / CMake
      - uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-37" "build-tools;36.0.0" > /dev/null 2>&1 || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # 从 nodejs-mobile release 拉取预编译的 libnode.so + 头文件
      - name: Fetch nodejs-mobile libnode
        run: |
          curl -sL -o /tmp/nodejs-mobile.zip https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip
          unzip -o /tmp/nodejs-mobile.zip -d /tmp/nodejs-mobile
          mkdir -p app/libnode/bin/arm64-v8a
          cp /tmp/nodejs-mobile/bin/arm64-v8a/libnode.so app/libnode/bin/arm64-v8a/
          cp -r /tmp/nodejs-mobile/include/* app/libnode/include/

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign release APK
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias guandan -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass PASSWORD -keypass PASSWORD -dname "CN=Guandan Server, OU=Hanazar, O=Hanazar Games, L=NA, S=NA, C=CN" > /dev/null 2>&1
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER sign --ks release.keystore --ks-pass pass:PASSWORD --key-pass pass:PASSWORD \
            --out app/build/outputs/apk/release/signed.apk app/build/outputs/apk/release/*-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/signed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
